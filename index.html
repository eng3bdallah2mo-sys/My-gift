<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاجة صغيرة ليكي ♡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose: #c9184a;
      --rose-soft: #e07a8f;
      --gold: #d4a373;
      --text: #6b4350;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f3, #fde4ea);
      font-family: "Tahoma", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
      overflow-x: hidden;
    }

    .petal {
      position: fixed;
      top: -40px;
      font-size: 18px;
      opacity: .7;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 0;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.88);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(201, 24, 74, 0.15);
      border: 1px solid #f8d3dc;
    }

    .flower { font-size: 45px; margin-bottom: 15px; }

    .small-title {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h1 { color: var(--rose); font-size: 30px; margin-bottom: 20px; }

    .name {
      font-size: 27px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--rose-soft);
      margin: 20px 0;
    }

    .message { font-size: 17px; line-height: 2; margin: 20px 0; }

    .line {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 25px auto;
    }

    .song-title { color: var(--rose); margin-bottom: 15px; }

    button {
      background: var(--rose);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(201, 24, 74, 0.3);
      transition: transform .2s, background .2s;
    }
    button:hover { background: #a4133c; }
    button:active { transform: scale(.96); }

    .footer { margin-top: 30px; font-size: 13px; color: var(--gold); }
